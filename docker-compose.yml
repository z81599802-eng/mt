version: '3.9'
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mubarak_tabarak
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - '3307:3306'

  server:
    build: ./server
    depends_on:
      - mysql
    environment:
      DATABASE_URL: mysql://root:root@mysql:3306/mubarak_tabarak
      PORT: 4000
      JWT_SECRET: changeme
      OTP_SECRET: otpsecret
      CLIENT_URL: http://customer:3000
      ADMIN_URL: http://admin:3000
    ports:
      - '4000:4000'

  customer:
    build: ./apps/customer
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - '3001:3000'

  admin:
    build: ./apps/admin
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
    ports:
      - '3002:3000'

  nginx:
    image: nginx:1.25
    depends_on:
      - customer
      - admin
      - server
    ports:
      - '8080:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  mysql-data:
